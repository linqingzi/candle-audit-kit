name: Synthetic tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.15'
      - name: Install pinned dependencies and project
        run: |
          python -m pip install --index-url https://pypi.org/simple -r requirements-test-lock.txt
          python -m pip install --no-build-isolation --no-deps .
          python -m pip check
      - name: Verify canonical source checksums
        run: python -B scripts/verify_checksums.py
      - name: Run complete synthetic suite
        run: python -B -m pytest -q --durations=10
      - name: Smoke test installed package outside source tree
        run: |
          mkdir -p "$RUNNER_TEMP/candle-audit-smoke"
          cd "$RUNNER_TEMP/candle-audit-smoke"
          candle-audit demo --root data/demo
      - name: Build distributions
        run: python -m build --no-isolation --outdir "$RUNNER_TEMP/candle-audit-dist"
