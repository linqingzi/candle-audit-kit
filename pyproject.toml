[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "candle-audit-kit"
version = "0.1.0rc2"
description = "Offline exact-decimal candle validation, reconciliation and reproducible datasets"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE", "LICENSE-STATUS.md", "PROVENANCE.md", "THIRD_PARTY_NOTICES.md", "licenses/*", "licenses/third-party/*/*"]
dependencies = [
  "ccxt==4.5.64",
  "duckdb==1.5.6",
  "pyarrow==25.0.0",
  "pandas==3.0.3",
  "numpy==2.4.6",
  "cryptography==50.0.2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "hypothesis>=6.140,<7", "pytest-cov>=6.3,<8"]
dev = ["build>=1.3,<2", "hatchling>=1.27,<2"]

[project.scripts]
candle-audit = "candle_audit.data_layer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/candle_audit"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "docs", "examples", "scripts", "licenses", "pyproject.toml", "README.md", "README.zh-TW.md", "CHANGELOG.md", "LICENSE", "LICENSE-STATUS.md", "PROVENANCE.md", "THIRD_PARTY_NOTICES.md", "RELEASE_STATUS.md", "requirements-test-lock.txt", "CHECKSUMS.sha256", ".gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"
markers = ["property: full-domain generated checks with the retained 1000-example settings"]

[tool.coverage.run]
data_file = ".tmp-data-layer/.coverage"

